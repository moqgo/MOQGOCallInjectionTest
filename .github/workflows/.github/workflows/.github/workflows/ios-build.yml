name: iOS Build - MOQGOCallInjectionTest

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "=== macOS ==="
          sw_vers
          echo "=== Xcode ==="
          xcodebuild -version
          echo "=== SDKs ==="
          xcodebuild -showsdks | grep iOS

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project MOQGOCallInjectionTest.xcodeproj \
            -scheme MOQGOCallInjectionTest \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MOQGOCallInjectionTest.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export Unsigned IPA
        run: |
          echo '{"signingStyle":"manual","method":"development"}' > build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/MOQGOCallInjectionTest.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist || echo "done"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MOQGOCallInjectionTest-unsigned-ipa
          path: build/ipa/*.ipa
          retention-days: 90

      - name: Build Report
        run: |
          echo "BUILD: PASS"
          echo "SIGNING: MISSING"
          echo "IPA: build/ipa/MOQGOCallInjectionTest.ipa"
