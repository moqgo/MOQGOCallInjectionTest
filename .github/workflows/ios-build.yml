name: iOS Build - MOQGOCallInjectionTest

# 触发方式：
# 1. push 到 main 分支自动编译
# 2. 手动在 Actions 页面点 Run workflow
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# GitHub 免费额度：macOS runner 每月 2000 分钟（个人账号）
# 每次编译约 5-10 分钟
jobs:
  build:
    runs-on: macos-14  # macOS 14, Xcode 15.3, 支持 iOS 18.2
    steps:
      # ========== 1. 拉代码 ==========
      - name: Checkout code
        uses: actions/checkout@v4

      # ========== 2. 显示环境信息 ==========
      - name: Show environment
        run: |
          echo "=== macOS 版本 ==="
          sw_vers
          echo "=== Xcode 版本 ==="
          xcodebuild -version
          echo "===可用 SDK ==="
          xcodebuild -showsdks | grep iOS

      # ========== 3. 编译 Archive ==========
      - name: Build Archive
        run: |
          echo "开始编译 Archive..."
          xcodebuild archive \
            -project MOQGOCallInjectionTest.xcodeproj \
            -scheme MOQGOCallInjectionTest \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MOQGOCallInjectionTest.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -allowProvisioningUpdates
          echo "Archive 编译完成"
          ls -la build/

      # ========== 4. 导出 Unsigned IPA ==========
      - name: Export Unsigned IPA
        run: |
          echo '{"signingStyle":"manual","teamID":"","method":"development"}' > build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/MOQGOCallInjectionTest.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist \
            || echo "导出完成（unsigned）"
          ls -la build/ipa/

      # ========== 5. 上传 IPA 作为 Artifact ==========
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MOQGOCallInjectionTest-unsigned-ipa
          path: build/ipa/*.ipa
          retention-days: 90

      # ========== 6. 输出状态报告 ==========
      - name: Build Report
        run: |
          echo "=============================="
          echo "BUILD: PASS"
          echo "=============================="
          echo ""
          echo "SIGNING: MISSING"
          echo "  - 当前输出的是 unsigned IPA（未签名）"
          echo "  - 需要用 AltServer / Sideloadly 手动签名安装"
          echo ""
          echo "IPA PATH: build/ipa/MOQGOCallInjectionTest.ipa"
          echo ""
          echo "=============================="
          echo "⚠️  重要说明"
          echo "=============================="
          echo ""
          echo "1. Unsigned IPA 不能直接装到 iPhone"
          echo "   需要用 AltServer 或 Sideloadly 重新签名"
          echo ""
          echo "2. 免费 Apple ID 签名的 App 有效期 7 天"
          echo "   7 天后需要重新签名安装"
          echo ""
          echo "3. 永久使用需要："
          echo "   - Apple Developer Program: $99/年"
          echo "   - 或企业级证书（$299/年）"
          echo ""
          echo "4. Microphone Injection API 可能需要："
          echo "   - iOS 18.2+"
          echo "   - 特定权限 entitlement"
          echo "   - 真机测试才能确认是否可用"
          echo ""
          echo "=============================="
