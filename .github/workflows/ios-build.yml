name: iOS Build

on: [push]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild build -project MOQGOCallInjectionTest.xcodeproj -scheme MOQGOCallInjectionTest -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - run: |
          APP=$(find build/Build/Products -name "*.app" | head -1)
          mkdir -p Payload
          cp -R $APP Payload/
          zip -r app.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: app.ipa
