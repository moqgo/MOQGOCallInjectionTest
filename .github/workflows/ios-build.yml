name: iOS Build - MOQGOCallInjectionTest

on:
  push:
      branches: [ main ]
        workflow_dispatch:

        jobs:
          build:
              runs-on: macos-14
                  steps:
                        - name: Checkout code
                                uses: actions/checkout@v4

                                      - name: Build Archive
                                              run: |
                                                        set -o pipefail
                                                                  xcodebuild archive \
                                                                              -project MOQGOCallInjectionTest.xcodeproj \
                                                                                          -scheme MOQGOCallInjectionTest \
                                                                                                      -configuration Release \
                                                                                                                  -destination 'generic/platform=iOS' \
                                                                                                                              -archivePath build/MOQGOCallInjectionTest.xcarchive \
                                                                                                                                          CODE_SIGN_IDENTITY="" \
                                                                                                                                                      CODE_SIGNING_REQUIRED=NO \
                                                                                                                                                                  CODE_SIGNING_ALLOWED=NO 2>&1 | tee build_log.txt || (echo "=== BUILD FAILED ===" && tail -100 build_log.txt && exit 1)
                                                                                                                                                                  
                                                                                                                                                                        - name: Export IPA
                                                                                                                                                                                run: |
                                                                                                                                                                                          mkdir -p build
                                                                                                                                                                                                    cat > build/ExportOptions.plist << 'EOF'
                                                                                                                                                                                                              <?xml version="1.0" encoding="UTF-8"?>
                                                                                                                                                                                                                        <plist version="1.0">
                                                                                                                                                                                                                                  <dict>
                                                                                                                                                                                                                                              <key>signingStyle</key>
                                                                                                                                                                                                                                                          <string>manual</string>
                                                                                                                                                                                                                                                                      <key>method</key>
                                                                                                                                                                                                                                                                                  <string>development</string>
                                                                                                                                                                                                                                                                                            </dict>
                                                                                                                                                                                                                                                                                                      </plist>
                                                                                                                                                                                                                                                                                                                EOF
                                                                                                                                                                                                                                                                                                                          xcodebuild -exportArchive \
                                                                                                                                                                                                                                                                                                                                      -archivePath build/MOQGOCallInjectionTest.xcarchive \
                                                                                                                                                                                                                                                                                                                                                  -exportPath build/ipa \
                                                                                                                                                                                                                                                                                                                                                              -exportOptionsPlist build/ExportOptions.plist || echo "export failed"
                                                                                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                                                                                                    - name: Upload IPA
                                                                                                                                                                                                                                                                                                                                                                            uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                                                                                                    with:
                                                                                                                                                                                                                                                                                                                                                                                              name: MOQGOCallInjectionTest-ipa
                                                                                                                                                                                                                                                                                                                                                                                                        path: build/ipa/*.ipa
                                                                                                                                                                                                                                                                                                                                                                                                                  retention-days: 90
                                                                                                                                                                                                                                                                                                                                                                                                                  
