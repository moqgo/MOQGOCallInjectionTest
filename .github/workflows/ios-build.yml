name: iOS Build - MOQGOCallInjectionTest

on:
  push:
      branches: [ main ]
        workflow_dispatch:

        jobs:
          build:
              runs-on: macos-14
                  steps:
                        - name: Checkout code
                                uses: actions/checkout@v4
                                      - name: Build Archive
                                              run: xcodebuild archive -project MOQGOCallInjectionTest.xcodeproj -scheme MOQGOCallInjectionTest -configuration Release -destination 'generic/platform=iOS' -archivePath build/MOQGOCallInjectionTest.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
                                                    - name: Create plist
                                                            run: printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n<key>method</key>\n<string>development</string>\n</dict>\n</plist>\n' > build/ExportOptions.plist
                                                                  - name: Export IPA
                                                                          run: xcodebuild -exportArchive -archivePath build/MOQGOCallInjectionTest.xcarchive -exportPath build/ipa -exportOptionsPlist build/ExportOptions.plist
                                                                                - name: Upload IPA
                                                                                        uses: actions/upload-artifact@v4
                                                                                                with:
                                                                                                          name: ipa
                                                                                                                    path: build/ipa/*.ipa
